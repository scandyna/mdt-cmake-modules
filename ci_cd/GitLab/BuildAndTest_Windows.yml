Build_Windows_Msvc16_x86_64_Debug:
  image: registry.gitlab.com/scandyna/docker-images-windows/windows-cpp-msvc2019:latest
  variables:
    # Give the full path to the toolchain file because it will be passed to tests
    TOOLCHAIN_FILE: "${CI_PROJECT_DIR}/toolchains/windows_msvc_16_2019.cmake"
    CMAKE_GENERATOR: "Visual Studio 16 2019"
    CMAKE_GENERATOR_PLATFORM: "x64"
    BUILD_TYPE: Debug
  extends: .build_windows

Test_Windows_Msvc16_x86_64_Debug:
  image: registry.gitlab.com/scandyna/docker-images-windows/windows-cpp-msvc2019:latest
  dependencies:
    - Build_Windows_Msvc16_x86_64_Debug
