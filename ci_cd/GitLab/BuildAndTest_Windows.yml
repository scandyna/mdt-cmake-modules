
include:
  - local: 'ci_cd/GitLab/BuildAndTest_Templates.yml'


#######################################################
# Tests without dependencies
# We don't use Conan generated config files here,
# so we can keep track on how it works without them.
# Also, some tests like MdtRuntimeEnvironment static tests
# can only be enabled in this mode.
#######################################################

Build_Windows_Gcc8_x86_64_MinGW_Make_Debug:
  image: registry.gitlab.com/scandyna/docker-images-windows/windows-cpp-win64_mingw81:latest
  variables:
    # Give the full path to the toolchain file because it will be passed to tests
    TOOLCHAIN_FILE: "${CI_PROJECT_DIR}/toolchains/windows_gcc8_mingw_make.cmake"
    CMAKE_GENERATOR: "MinGW Makefiles"
    BUILD_TYPE: Debug
  extends: .build_windows

Test_Windows_Gcc8_x86_64_MinGW_Make_Debug:
  image: registry.gitlab.com/scandyna/docker-images-windows/windows-cpp-win64_mingw81:latest
  dependencies:
    - Build_Windows_Gcc8_x86_64_MinGW_Make_Debug
  needs: ["Build_Windows_Gcc8_x86_64_MinGW_Make_Debug"]
  extends: .test_windows

