
.BuildAndTest_rules: &BuildAndTest_rules
  - changes:
    - ci_cd/GitLab/*
    - doc/**/*
    - Modules/**/*
    - tests/**/*
    - toolchains/**/*
    - .gitlab-ci.yml
    - CMakeLists.txt
    - conanfile.py
    when: on_success


.windows_runner:
  tags:
    - docker-windows

.setup_conan:
  script:
    - conan remote remove conancenter
    - conan remote add scandyna https://gitlab.com/api/v4/projects/25668674/packages/conan
    - conan config install --source-folder conan https://gitlab.com/api/v4/projects/16304913/packages/generic/conan2_config/0.2.0/conan_config.zip
    #- conan config install --source-folder conan https://gitlab.com/api/v4/projects/16304913/packages/generic/conan1_config/0.1.6/conan_config.zip

.conan_install:
  script:
    - conan install
      --profile:build $CONAN_PROFILE_BUILD --profile:host $CONAN_PROFILE_HOST
      --settings:build build_type=Release --settings:host build_type=$BUILD_TYPE
      ..

.cmake_configure:
  script:
    # The toolchain file expression has to be quoted when using Powershell
    # See https://gitlab.kitware.com/cmake/cmake/-/issues/23109
    - cmake "-DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN_FILE}"
      "-DCMAKE_BUILD_TYPE=$BUILD_TYPE"
      -DBUILD_TESTS=ON
      -DBUILD_CONAN_TESTS=ON
      "-DBUILD_QT_TESTS=${BUILD_QT_TESTS}"
      "-DBUILD_REAL_INSTALL_TESTS=${BUILD_REAL_INSTALL_TESTS}"
      -DWARNING_AS_ERROR=ON
      -DCMAKE_MESSAGE_LOG_LEVEL=DEBUG
      $CMAKE_EXTRA_ARGUMENTS
      ..

#######################################################
# Tests without dependencies
# We don't use Conan generated config files here,
# so we can keep track on how it works without them.
# Also, some tests like MdtRuntimeEnvironment static tests
# can only be enabled in this mode.
#######################################################

.build_base:
  stage: build
  rules: *BuildAndTest_rules
  variables:
    BUILD_QT_TESTS: 'OFF'
  script:
    - mkdir build
    - cd build
    - !reference [.cmake_configure, script]
    - cmake --build . --config $BUILD_TYPE -j2
  artifacts:
    expire_in: 1 day
    paths:
      - build

.build_linux:
  variables:
    BUILD_REAL_INSTALL_TESTS: 'ON'
  extends:
    - .build_base

.build_windows:
  variables:
    BUILD_REAL_INSTALL_TESTS: 'OFF'
  extends:
    - .build_base
    - .windows_runner


.test_base:
  stage: test
  rules: *BuildAndTest_rules
  script:
    - cd build
    - ctest --verbose -C "${BUILD_TYPE}"
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - build

.test_linux:
  extends:
    - .test_base
  before_script:
    - !reference [.setup_conan, script]
    - export DISPLAY=":99"
    - /etc/init.d/xdummy-server start
    - sysctl vm.mmap_rnd_bits=28 # See https://gitlab.com/scandyna/mdt-cmake-modules/-/issues/19

.test_windows:
  extends:
    - .test_base
    - .windows_runner
  before_script:
    - !reference [.setup_conan, script]

#######################################################
# Tests including those depending on Qt
# We try to not build Docker images with Qt anymore,
# so try to use Conan here
#######################################################

.build_linux_WithQt:
  stage: build
  rules: *BuildAndTest_rules
  variables:
    # Give the full path to the toolchain file because it will be passed to tests
    TOOLCHAIN_FILE: "${CI_PROJECT_DIR}/build/conan_toolchain.cmake"
    BUILD_QT_TESTS: 'ON'
    BUILD_REAL_INSTALL_TESTS: 'ON'
  before_script:
    - !reference [.setup_conan, script]
  script:
    - mkdir build
    - cd build
    - !reference [.conan_install, script]
    - source conanbuild.sh || true  # Workaround to https://gitlab.com/gitlab-org/ci-cd/pipeline-authoring-stack-rank/-/issues/1
    - !reference [.cmake_configure, script]
    - cmake --build . --config $BUILD_TYPE -j2
    - source deactivate_conanbuild.sh
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - build

.build_windows_WithQt:
  stage: build
  rules: *BuildAndTest_rules
  variables:
    # Give the full path to the toolchain file because it will be passed to tests
    TOOLCHAIN_FILE: "${CI_PROJECT_DIR}/build/conan_toolchain.cmake"
    BUILD_QT_TESTS: 'ON'
    BUILD_REAL_INSTALL_TESTS: 'OFF'
  before_script:
    - !reference [.setup_conan, script]
  script:
    - mkdir build
    - cd build
    - !reference [.conan_install, script]
    - .\conanbuild
    - !reference [.cmake_configure, script]
    - cmake --build . --config $BUILD_TYPE -j2
    - .\deactivate_conanbuild
  extends:
    - .windows_runner
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - build


.test_base_WithQt:
  stage: test
  rules: *BuildAndTest_rules
  script:
    - cd build
    - !reference [.setup_conan, script]
    - !reference [.conan_install, script]
    - ctest --verbose -C "${BUILD_TYPE}"
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - build

.test_linux_WithQt:
  extends:
    - .test_base_WithQt
  before_script:
    - export DISPLAY=":99"
    - /etc/init.d/xdummy-server start
    - sysctl vm.mmap_rnd_bits=28 # See https://gitlab.com/scandyna/mdt-cmake-modules/-/issues/19

.test_windows_WithQt:
  extends:
    - .test_base_WithQt
    - .windows_runner
