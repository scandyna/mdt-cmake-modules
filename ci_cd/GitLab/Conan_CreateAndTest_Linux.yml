include:
  - local: 'ci_cd/GitLab/BuildAndTest_Templates.yml'


.conan_createAndTest_Linux:
  before_script:
    - export DISPLAY=":99"
    - /etc/init.d/xdummy-server start
    - sysctl vm.mmap_rnd_bits=28 # See https://gitlab.com/scandyna/mdt-cmake-modules/-/issues/19
  script:
    - !reference [.setup_conan, script]
    - conan remote add scandyna_test $TEST_CONAN_PACKAGE_REMOTE
    - conan create $CONAN_PACKAGING_DIR/$COMPONENT --version 0.0.0 --user scandyna --channel testing
      --profile:build $CONAN_PROFILE_BUILD --profile:host $CONAN_PROFILE_HOST
      --settings:build build_type=Release --settings:host build_type=$BUILD_TYPE
      --test-folder None
    - conan test $CONAN_PACKAGING_DIR/$COMPONENT/test_package $COMPONENT/0.0.0@scandyna/testing
      --profile:build $CONAN_PROFILE_BUILD --profile:host $CONAN_PROFILE_HOST
      --settings:build build_type=Release --settings:host build_type=$BUILD_TYPE
    - conan user --password ${CI_JOB_TOKEN} --remote scandyna_test ci_user
    - conan upload $COMPONENT/0.0.0@scandyna/testing --remote scandyna_test --all -c


Conan_CreateAndTest_Ubuntu-24-04_gcc13_x86_64:
  stage: build
  image: registry.gitlab.com/scandyna/docker-images-ubuntu/ubuntu-24.04-gcc-13:latest
  variables:
    CONAN_PROFILE_BUILD: linux_gcc13_x86_64
    CONAN_PROFILE_HOST: linux_ubuntu-24.04_gcc13_x86_64
    CONAN_PACKAGING_DIR: 'packaging/conan/'
    COMPONENT: 'mdtcmakemodules'
    TEST_CONAN_PACKAGE_REMOTE: 'https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/conan'
    BUILD_TYPE: Debug
  extends:
    - .conan_createAndTest_Linux
  # Avoid getting artifacts from previous stages
  dependencies: []
