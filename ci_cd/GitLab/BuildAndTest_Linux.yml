
include:
  - local: 'ci_cd/GitLab/BuildAndTest_Templates.yml'


#######################################################
# Tests without dependencies
# We don't use Conan generated config files here,
# so we can keep track on how it works without them.
# Also, some tests like MdtRuntimeEnvironment static tests
# can only be enabled in this mode.
#######################################################

Build_Linux_Gcc13_x86_64_Make_CoreTestsOnly_Debug:
  image: registry.gitlab.com/scandyna/docker-images-ubuntu/ubuntu-24.04-gcc-13:latest
  variables:
    CMAKE_CONFIGURE_PRESET: "dev_unix_makefiles_gcc13_core_tests_only"
    BUILD_TYPE: Debug
  extends: .build_linux

Test_Linux_Gcc13_x86_64_Make_CoreTestsOnly_Debug:
  image: registry.gitlab.com/scandyna/docker-images-ubuntu/ubuntu-24.04-gcc-13:latest
  dependencies:
    - Build_Linux_Gcc13_x86_64_Make_CoreTestsOnly_Debug
  needs: ["Build_Linux_Gcc13_x86_64_Make_CoreTestsOnly_Debug"]
  extends: .test_linux


