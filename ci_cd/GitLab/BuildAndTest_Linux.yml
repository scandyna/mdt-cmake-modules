
include:
  - local: 'ci_cd/GitLab/BuildAndTest_Templates.yml'


#######################################################
# Tests without dependencies
# We don't use Conan generated config files here,
# so we can keep track on how it works without them.
# Also, some tests like MdtRuntimeEnvironment static tests
# can only be enabled in this mode.
#######################################################

Build_Linux_Gcc13_x86_64_Make_Debug:
  image: registry.gitlab.com/scandyna/docker-images-ubuntu/ubuntu-24.04-gcc-13:latest
  variables:
    # Give the full path to the toolchain file because it will be passed to tests
    TOOLCHAIN_FILE: "${CI_PROJECT_DIR}/toolchains/linux_gcc13_make.cmake"
    BUILD_TYPE: Debug
  extends: .build_linux

Test_Linux_Gcc13_x86_64_Make_Debug:
  image: registry.gitlab.com/scandyna/docker-images-ubuntu/ubuntu-24.04-gcc-13:latest
  dependencies:
    - Build_Linux_Gcc13_x86_64_Make_Debug
  needs: ["Build_Linux_Gcc13_x86_64_Make_Debug"]
  extends: .test_linux


Build_Linux_Gcc8_x86_64_Make_Debug:
  image: registry.gitlab.com/scandyna/docker-images-ubuntu/ubuntu-18.04-gcc-8:latest
  variables:
    # Give the full path to the toolchain file because it will be passed to tests
    TOOLCHAIN_FILE: "${CI_PROJECT_DIR}/toolchains/linux_gcc8_make.cmake"
    BUILD_TYPE: Debug
  extends: .build_linux

Test_Linux_Gcc8_x86_64_Make_Debug:
  image: registry.gitlab.com/scandyna/docker-images-ubuntu/ubuntu-18.04-gcc-8:latest
  dependencies:
    - Build_Linux_Gcc8_x86_64_Make_Debug
  needs: ["Build_Linux_Gcc8_x86_64_Make_Debug"]
  extends: .test_linux


Build_Linux_Clang10_x86_64_libcxx_Make_Debug:
  image: registry.gitlab.com/scandyna/docker-images-ubuntu/ubuntu-18.04-clang-10:latest
  variables:
    # Give the full path to the toolchain file because it will be passed to tests
    TOOLCHAIN_FILE: "${CI_PROJECT_DIR}/toolchains/linux_clang10_x86_64_libcxx_make.cmake"
    BUILD_TYPE: Debug
  extends: .build_linux

Test_Linux_Clang10_x86_64_libcxx_Make_Debug:
  image: registry.gitlab.com/scandyna/docker-images-ubuntu/ubuntu-18.04-clang-10:latest
  dependencies:
    - Build_Linux_Clang10_x86_64_libcxx_Make_Debug
  needs: ["Build_Linux_Clang10_x86_64_libcxx_Make_Debug"]
  extends: .test_linux

#######################################################
# Tests including those depending on Qt
# We try to not build Docker images with Qt anymore,
# so try to use Conan here
#######################################################

.buildAndTest_Linux_gcc8_x86_64_WithQt:
  image: registry.gitlab.com/scandyna/docker-images-ubuntu/ubuntu-18.04-gcc-8:latest
  variables:
    CONAN_PROFILE_BUILD: linux_gcc8_x86_64
    CONAN_PROFILE_HOST: linux_ubuntu-18.04_gcc8_x86_64_qt_widgets_modules_boost

Build_Linux_Gcc8_x86_64_WithQt_Debug:
  variables:
    BUILD_TYPE: Debug
  extends:
    - .buildAndTest_Linux_gcc8_x86_64_WithQt
    - .build_linux_WithQt

Test_Linux_Gcc8_x86_64_WithQt_Debug:
  variables:
    BUILD_TYPE: Debug
  dependencies:
    - Build_Linux_Gcc8_x86_64_WithQt_Debug
  needs: ["Build_Linux_Gcc8_x86_64_WithQt_Debug"]
  extends:
    - .buildAndTest_Linux_gcc8_x86_64_WithQt
    - .test_linux_WithQt

